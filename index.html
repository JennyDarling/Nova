<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova — Ana Karakter, 7 Konsey Üyesi & İki Renkli Küre 3D Atölyesi</title>
  <meta name="description" content="Nova açık dünya oyunu için Kadın & Erkek genç ana karakter 3D modeli, yarı yarıya küre füzyonu, evrimleşen kanatlar, 7 konsey üyesi ve 21 iki renkli 3D küre." />
  <link rel="stylesheet" href="./src/styles/index.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>Nova — 3D Karakter & Küre Füzyon Atölyesi</h1>
        <p class="app-subtitle">Genç Ana Karakter (Kadın & Erkek • İki Yarım Küre Dönüşümü & Kanat Evrimi), 7 Konsey Üyesi ve 21 Küre</p>
      </div>
      <nav class="studio-tabs" aria-label="Atölye Görünümleri">
        <button id="tab-protagonist" type="button" class="tab-btn active">Ana Karakter 3D (Kadın & Erkek)</button>
        <button id="tab-characters" type="button" class="tab-btn">7 Konsey Üyesi 3D</button>
        <button id="tab-spheres" type="button" class="tab-btn">21 İki Renkli 3D Küre</button>
      </nav>
    </header>

    <!-- VIEW 0: 3D PROTAGONIST CUSTOMIZER & SPHERE FUSION / WING EVOLUTION STUDIO -->
    <section id="view-protagonist" class="studio-view" aria-label="3D Ana Karakter ve Evrim Sahnesi">
      <div class="controls-panel">
        <div class="sliders-row">
          <div class="btn-group" role="group" aria-label="Cinsiyet ve Kulak Seçimi">
            <button type="button" data-gender="kadin" class="swatch-btn prot-gender-btn active">Kadın (23)</button>
            <button type="button" data-gender="erkek" class="swatch-btn prot-gender-btn">Erkek (23)</button>
            <button type="button" data-gender="both" class="swatch-btn prot-gender-btn">İkisi Yan Yana</button>
            <button id="btn-prot-ear" type="button" class="swatch-btn active">Kulak: Sivri Peri</button>
          </div>

          <div class="btn-group" role="group" aria-label="Kamera ve Poligon Modu">
            <button id="btn-pcam-full" type="button" class="swatch-btn active">Tam Boy 3D</button>
            <button id="btn-pcam-bust" type="button" class="swatch-btn">Yüz & Kulak Yakın</button>
            <button id="btn-pcam-back" type="button" class="swatch-btn">Arka & Kanat 3D</button>
            <button id="btn-pcam-sheet" type="button" class="swatch-btn">3-Açılı HD Render</button>
            <button type="button" data-prender="shaded" class="swatch-btn prot-render-btn active">PBR 3D</button>
            <button type="button" data-prender="clay" class="swatch-btn prot-render-btn">Kil Heykel</button>
            <button type="button" data-prender="wireframe" class="swatch-btn prot-render-btn">Tel Kafes</button>
            <button id="btn-prot-obj" type="button" class="swatch-btn mono-btn">.OBJ İndir</button>
          </div>
        </div>
      </div>

      <div class="viewport-stage">
        <canvas id="protagonist-canvas"></canvas>

        <div id="prot-sheet-inspector" class="sheet-inspector" hidden>
          <img id="prot-sheet-img" alt="Ana Karakter 3-Açılı 3D Render Kartı" />
        </div>

        <div class="char-hud">
          <div class="char-hud-card">
            <div id="prot-hud-title" class="char-hud-title"></div>
            <div id="prot-hud-summary" class="char-hud-summary"></div>
          </div>
          <div id="prot-poly-badge" class="poly-badge">3D Yükleniyor...</div>
        </div>
      </div>

      <div class="controls-panel">
        <div class="sliders-row">
          <div class="btn-group" role="group" aria-label="Kanat Evrimi Aşamaları">
            <span>Kanat Evrimi:</span>
            <div id="prot-wing-pills" class="btn-group"></div>
          </div>

          <div class="btn-group">
            <label class="slider-control" for="prot-anim-toggle">
              <input id="prot-anim-toggle" type="checkbox" checked />
              <span>Canlı Salınım</span>
            </label>
            <button id="btn-prot-reset" type="button" class="swatch-btn">Ön Açıyı Sıfırla</button>
          </div>
        </div>

        <div class="sliders-row">
          <div class="btn-group">
            <button id="btn-fusion-toggle" type="button" class="swatch-btn active">Füzyon Küresi: Aktif (İki Yarı Renk)</button>
            <label class="slider-control" for="prot-color-a">
              <span>Sol Yarı:</span>
              <select id="prot-color-a" class="select-box"></select>
            </label>
            <label class="slider-control" for="prot-color-b">
              <span>Sağ Yarı:</span>
              <select id="prot-color-b" class="select-box"></select>
            </label>
          </div>

          <div id="prot-fusion-presets" class="btn-group"></div>
        </div>
      </div>
    </section>

    <!-- VIEW 1: 3D COUNCIL CHARACTERS STUDIO -->
    <section id="view-characters" class="studio-view" aria-label="3D Konsey Karakterleri Sahnesi" hidden>
      <div class="controls-panel">
        <div class="sliders-row">
          <div class="btn-group" role="group" aria-label="Kamera Açısı">
            <button id="btn-cam-full" type="button" class="swatch-btn active">Tam Boy 3D</button>
            <button id="btn-cam-bust" type="button" class="swatch-btn">Yüz & Zırh Yakın</button>
            <button id="btn-cam-back" type="button" class="swatch-btn">Arka 3D Açı</button>
            <button id="btn-cam-council" type="button" class="swatch-btn">7'li Konsey 3D</button>
            <button id="btn-cam-sheet" type="button" class="swatch-btn">3-Açılı HD Render Kartı</button>
          </div>

          <div class="btn-group" role="group" aria-label="3D Poligon Görünümü">
            <button type="button" data-render-mode="shaded" class="swatch-btn render-mode-btn active">PBR Dokulu 3D</button>
            <button type="button" data-render-mode="clay" class="swatch-btn render-mode-btn">Kil Heykel (ZBrush)</button>
            <button type="button" data-render-mode="wireframe" class="swatch-btn render-mode-btn">3D Tel Kafes</button>
            <button id="btn-export-obj" type="button" class="swatch-btn mono-btn">.OBJ İndir</button>
          </div>
        </div>
      </div>

      <div class="viewport-stage character-stage">
        <canvas id="character-canvas"></canvas>
        <div id="council-labels" class="overlay-layer"></div>

        <div id="sheet-inspector" class="sheet-inspector" hidden>
          <img id="sheet-inspector-img" alt="3-Açılı 3D Karakter Render Kartı" />
        </div>

        <div class="char-hud">
          <div class="char-hud-card">
            <div id="char-hud-title" class="char-hud-title"></div>
            <div id="char-hud-summary" class="char-hud-summary"></div>
          </div>
          <div id="char-poly-badge" class="poly-badge">Yükleniyor...</div>
        </div>
      </div>

      <div class="controls-panel">
        <div class="sliders-row">
          <div id="char-selector-pills" class="color-swatches"></div>

          <div class="btn-group">
            <label class="slider-control" for="char-anim-toggle">
              <input id="char-anim-toggle" type="checkbox" checked />
              <span>Canlı Salınım & Kanat</span>
            </label>
            <button id="btn-char-reset" type="button" class="swatch-btn">Ön Açıyı Sıfırla</button>
            <button id="btn-char-spheres" type="button" class="swatch-btn">Kürelerini Gör (6) →</button>
          </div>
        </div>
      </div>
    </section>

    <!-- VIEW 2: 3D TWO-COLOR ORGANIC SPHERES STUDIO -->
    <section id="view-spheres" class="studio-view" aria-label="3D İki Renkli Küre Sahnesi" hidden>
      <div class="controls-panel" aria-label="Renk Filtreleri">
        <div class="sliders-row">
          <div id="color-swatches" class="color-swatches"></div>
          <button id="btn-reset-angle" type="button" class="swatch-btn">Ön Açıyı Sıfırla</button>
        </div>
        <p id="active-sphere-status" class="status-line">21 İki Renkli Küre • Bir küreye tıklayarak yakından inceleyin</p>
      </div>

      <div class="viewport-stage">
        <canvas id="sphere-canvas"></canvas>
        <div id="sphere-labels" class="overlay-layer"></div>
        <div id="hover-tooltip" class="sphere-tooltip" hidden></div>
        <button id="btn-back-gallery" type="button" class="back-btn" hidden>← Galeriye Dön</button>
      </div>

      <div class="controls-panel" aria-label="Doku ve Renk Ayarları">
        <div id="single-picker-row" class="sliders-row" hidden>
          <div class="slider-control">
            <span>Sol Yarı + Sağ Yarı:</span>
            <select id="select-color-a" class="select-box"></select>
            <span>+</span>
            <select id="select-color-b" class="select-box"></select>
          </div>
        </div>

        <div class="sliders-row">
          <label class="slider-control" for="input-depth">
            <span>Girinti-Çıkıntı Derinliği</span>
            <input id="input-depth" type="range" min="12" max="46" value="31" />
            <span id="readout-depth" class="readout">31%</span>
          </label>

          <label class="slider-control" for="input-freq">
            <span>Bakteri Dokusu Yoğunluğu</span>
            <input id="input-freq" type="range" min="18" max="50" value="32" />
            <span id="readout-freq" class="readout">3.2x</span>
          </label>

          <label class="slider-control" for="input-pulse">
            <input id="input-pulse" type="checkbox" checked />
            <span>Canlı Salınım</span>
          </label>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
